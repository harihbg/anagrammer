<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Anagrammer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
    <div class="container">
        <header>
            <h1>Anagrammer</h1>
            <p>Find words from set of letters</p>
            <p>Disclaimer: This tool is for personal educational use. Word lists are compiled from public domain sources</p>
        </header>

        <main>
            <div class="input-group">
                <input type="text" id="letters" placeholder="Enter tiles..." autofocus autocomplete="off" spellcheck="false" inputmode="search">
                <button id="clear-btn" aria-label="Clear input">&times;</button>
            </div>

            <div id="status" class="status">Loading dictionary...</div>

            <div id="results-container" class="hidden">
                <div class="results-header">
                    <span id="result-count">0 words found</span>
                </div>
                <div id="results-list"></div>
            </div>
        </main>
    </div>

    <!-- Load application logic -->
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
